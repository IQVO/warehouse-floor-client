# The floor client's static runtime.
#
# Serves the PWA shell ONLY. It never proxies an API: Kong owns every
# /api/<context> route and must also be what answers them at this origin
# (the cluster's edge routes /api to Kong and everything else here). The
# service worker is also served from here, with rules that keep it fresh.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A request for /api reaching this server means the edge routing is wrong.
    # Answer 404 problem+json instead of falling through to the SPA fallback:
    # index.html with a 200 would look like a successful (but bogus) API reply.
    location /api/ {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        return 404 '{"type":"about:blank","title":"No API at this address","status":404,"detail":"The floor client is served without an API. /api/<context> must be routed to Kong at the same origin."}';
    }

    # The service worker and the manifest must never be served stale, or a
    # redeploy could be pinned behind an old app shell.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        default_type application/javascript;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Single add_header carrying max-age (no `expires`) so exactly one
    # Cache-Control header is sent -- same reasoning as the console.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side (React Router) routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
