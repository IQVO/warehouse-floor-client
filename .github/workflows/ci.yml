name: CI

# warehouse-floor-client depends on @warehouse/ui-kit via `file:../warehouse-ui-kit`
# (no npm registry publish step yet). Like warehouse-console, CI checks out both
# repos as SIBLING directories under $GITHUB_WORKSPACE so that relative path
# resolves the same way it does on a contributor's machine.
#
# Job names (lint, test, typecheck, build, docs) are the branch-protection
# contract and mirror warehouse-console. Do not rename them.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: warehouse-floor-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: IQVO/warehouse-ui-kit
          ref: develop
          path: warehouse-ui-kit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: warehouse-ui-kit
      - run: npm ci
        working-directory: warehouse-floor-client
      - run: npm run lint
        working-directory: warehouse-floor-client

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: warehouse-floor-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: IQVO/warehouse-ui-kit
          ref: develop
          path: warehouse-ui-kit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: warehouse-ui-kit
      - run: npm ci
        working-directory: warehouse-floor-client
      - run: npm test
        working-directory: warehouse-floor-client

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: warehouse-floor-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: IQVO/warehouse-ui-kit
          ref: develop
          path: warehouse-ui-kit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: warehouse-ui-kit
      - run: npm ci
        working-directory: warehouse-floor-client
      - run: npm run typecheck
        working-directory: warehouse-floor-client

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: warehouse-floor-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: IQVO/warehouse-ui-kit
          ref: develop
          path: warehouse-ui-kit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: warehouse-ui-kit
      - run: npm ci
        working-directory: warehouse-floor-client
      - run: npm run build
        working-directory: warehouse-floor-client

  # Docusaurus site in docs/ (same job as warehouse-console): typecheck and a
  # full build, which fails on any broken link or MDX error.
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
